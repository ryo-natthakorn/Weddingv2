     sits beside: a solid coloured disc with a white symbol on it, same as
     Grab's green circle and the MRT's pink mark. The disc uses Monogram Gold
     (#8A7030) so the one non-brand row still belongs to this card's palette.
     200x200 viewBox to match the MRT mark's scale. -->
